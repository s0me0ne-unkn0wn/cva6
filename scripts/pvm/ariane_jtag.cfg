# Genesys2 on-board FT2232H -> CVA6 RISC-V debug TAP (irlen 5). No `init` here:
# the PVM run scripts pass `-c init -c halt -c "load_image ..." -c "reg pc ..." -c resume`.
adapter speed 1000
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -ndata 0x0010
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5
target create $_CHIPNAME.cpu riscv -chain-position $_CHIPNAME.cpu
